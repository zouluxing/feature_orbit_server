app:
  name: ums
  env: development
  port: 8081
  debug: true

db:
  url: "postgres://postgres:postgres@localhost:5433/ums_db?sslmode=disable"
  max_open_conns: 10
  max_idle_conns: 5

redis:
  addr: "localhost:6380"
  password: "redis_password"
  db: 1

jwt:
  private_key_path: "configs/ums_rsa_private.pem"
  public_key_path: "configs/ums_rsa_public.pem"
  access_ttl: "15m"
  refresh_ttl: "168h"
  issuer: "ums"
  key_id: "ums-rsa-1"

oauth2:
  auth_code_ttl: "10m"

rate_limit:
  login_max_attempts: 5
  login_window_secs: 300
  lock_duration_mins: 30
