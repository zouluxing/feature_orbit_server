version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: ums_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ums_db
    ports: ["5433:5432"]
    volumes: [ums_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s; timeout: 5s; retries: 5
    networks: [ums_network]

  redis:
    image: redis:7-alpine
    container_name: ums_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password
    ports: ["6380:6379"]
    volumes: [ums_redis_data:/data]
    healthcheck:
      test: ["CMD","redis-cli","-a","redis_password","ping"]
      interval: 10s; timeout: 5s; retries: 5
    networks: [ums_network]

  ums:
    build: {context: ., dockerfile: Dockerfile}
    container_name: ums_app
    restart: unless-stopped
    env_file: .env
    environment:
      UMS_CONFIG_PATH: /app/configs/config.yaml
      UMS_DB_URL: postgres://postgres:postgres@postgres:5432/ums_db?sslmode=disable
      UMS_REDIS_ADDR: redis:6379
      UMS_REDIS_PASSWORD: redis_password
    ports: ["8081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [ums_network]

volumes:
  ums_postgres_data:
  ums_redis_data:

networks:
  ums_network:
    driver: bridge
