name: App CI

on:
  push:
    branches: [develop, main]
    paths: ['*.go', 'cmd/**', 'internal/**', 'go.mod', 'go.sum']
  pull_request:
    branches: [develop, main]
    paths: ['*.go', 'cmd/**', 'internal/**', 'go.mod', 'go.sum']

env:
  GO_VERSION: '1.21'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - run: go mod download
      - run: go test ./... -v -timeout 60s

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build -ldflags "-s -w" -o bin/feature_orbit_server ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: feature-orbit-server-binary
          path: bin/feature_orbit_server
          retention-days: 3
