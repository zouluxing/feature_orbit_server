name: Integration Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  integration:
    name: UMS + App Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ums_db
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install golang-migrate
        run: curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz && sudo mv migrate /usr/local/bin/migrate
      - name: Run UMS migrations
        run: migrate -path ums/migrations -database "postgres://postgres:postgres@localhost:5433/ums_db?sslmode=disable" up
      - name: Generate RSA keys
        run: |
          mkdir -p ums/configs
          openssl genrsa -out ums/configs/ums_rsa_private.pem 2048
          openssl rsa -in ums/configs/ums_rsa_private.pem -pubout -out ums/configs/ums_rsa_public.pem
      - name: Start UMS
        env:
          UMS_DB_URL: postgres://postgres:postgres@localhost:5433/ums_db?sslmode=disable
          UMS_REDIS_ADDR: localhost:6380
          UMS_JWT_PRIVATE_KEY_PATH: configs/ums_rsa_private.pem
          UMS_JWT_PUBLIC_KEY_PATH: configs/ums_rsa_public.pem
          UMS_APP_ENV: development
        run: |
          cd ums && go run ./cmd/server &
          sleep 5
          curl -f http://localhost:8081/health
      - name: Run UMS unit tests
        run: cd ums && go test ./tests/unit/... -v -timeout 60s -coverprofile=coverage.out
