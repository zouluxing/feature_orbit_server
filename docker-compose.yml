version: '3.9'

# feature_orbit_server 本地开发基础设施
# 启动顺序: 先 cd ums && docker compose up -d，再回根目录 docker compose up -d

services:

  postgres:
    image: postgres:16-alpine
    container_name: feature_orbit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: feature_orbit_db
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feature_orbit_app
    restart: unless-stopped
    environment:
      APP_PORT: 8080
      APP_DEBUG: "true"
      APP_DATABASE_URL: postgres://postgres:postgres@feature_orbit_postgres:5432/feature_orbit_db?sslmode=disable
      APP_UMS_BASE_URL: http://ums_app:8081
      APP_UMS_CACHE_TTL: 1h
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
      - shared_network

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
  shared_network:
    name: orbit_shared
    external: true
